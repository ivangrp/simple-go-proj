name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  REPO_NAME: ${{ github.event.repository.name }}
  REGION: us-central1
  PROJECT_ID: minsaitproject
  IMAGE_NAME: v1.0.0
  IMAGE_TAG: v1.0.0

jobs:
  build-and-push:

    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout code
        uses: actions/checkout@v4
        
        # Configuración de GCP
      - name: Set up Docker credentials for GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up project
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "branchname=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_ENV"
          else
            echo "branchname=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi  

          # Evaluacion de la rama con case
          case $branchname in
            main)
              enviroment="prod"
              ;;
            develop|feature/*)
              enviroment="dev"
              ;;
            *)
              echo "Rama no reconocida. Debe ser 'main' o 'develop'."
              exit 1
              ;;
          esac

          echo "Entorno: $enviroment"


      - name: Ensure Artifact Registry repository exists
        run: |
          if ! gcloud artifacts repositories describe $REPO_NAME \
            --location=$REGION \
            --project=$PROJECT_ID > /dev/null 2>&1; then
            echo "Repositorio $REPO_NAME no existe. Creándolo..."
            gcloud artifacts repositories create $REPO_NAME \
              --repository-format=docker \
              --location=$REGION \
              --description="Repositorio creado desde GitHub Actions"
          else
            echo "Repositorio $REPO_NAME ya existe."
          fi

      # Configura Docker para usar gcloud como helper
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t us-central1-docker.pkg.dev/$PROJECT_ID/docker-$REPO_NAME/$IMAGE_NAME:$IMAGE_TAG .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push us-central1-docker.pkg.dev/$PROJECT_ID/docker-$REPO_NAME/$IMAGE_NAME:$IMAGE_TAG

  deploy-dev:
    
    needs: [build-and-push]
    if: github.ref == 'refs/heads/develop' || 'refs/heads/feature/*'

    runs-on: ubuntu-latest
    environment: 
      name: dev
      url: https://github.com/${{ github.repository }}/releases/tag/v${{ vars.DEV_VERSION }}
    
    steps:
      - name: Deploy to Cloud Run
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          IMAGE_URI=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:$COMMIT_SHA

          gcloud run deploy ${{ env.IMAGE_NAME }} \
            --image $IMAGE_URI \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --project ${{ env.PROJECT_ID }}

  deploy-prod:
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    
    runs-on: ubuntu-latest
    environment: 
      name: prod
      url: https://github.com/${{ github.repository }}/releases/tag/v${{ vars.PROD_VERSION }}
    
    steps:
      - name: Download Docker image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}:${{ github.sha }}
      - name: Deploy to production environment
        run: |
          echo "Desplegando en el entorno de producción..."
          # Aquí puedes agregar los comandos específicos para desplegar tu aplicación
          # Por ejemplo, ejecutar un contenedor Docker con la imagen descargada
          docker run -d --name my_app_prod ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}:${{ github.sha }}
