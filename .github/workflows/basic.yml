name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  REGISTRY: docker.io
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  build-and-push:

    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout code
        uses: actions/checkout@v4
  
      # Configura GCP
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
        
      # Configura Docker para Artifact Registry
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
        
      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev
        
      # Construye y sube la imagen
      - name: Build Docker image
        run: |
          docker build -t my-app:latest .
        
      - name: Tag Docker image
        run: |
          docker tag my-app:latest \
          ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY }}/my-app:${{ github.sha }}
        
      - name: Push Docker image
        run: |
          docker push \
          ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY }}/my-app:${{ github.sha }}

  deploy-dev:
    
    needs: [build-and-push]
    if: github.ref == 'refs/heads/develop' || 'refs/heads/feature/*'

    runs-on: ubuntu-latest
    environment: 
      name: dev
      url: https://github.com/${{ github.repository }}/releases/tag/v${{ vars.DEV_VERSION }}
    
    steps:
      - name: Download Docker image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}:${{ github.sha }}
      - name: Deploy to development environment
        run: |
          echo "Desplegando en el entorno de desarrollo..."
          # Aquí puedes agregar los comandos específicos para desplegar tu aplicación
          # Por ejemplo, ejecutar un contenedor Docker con la imagen descargada
          docker run -d --name my_app_dev ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}:${{ github.sha }}

  deploy-prod:
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    
    runs-on: ubuntu-latest
    environment: 
      name: prod
      url: https://github.com/${{ github.repository }}/releases/tag/v${{ vars.PROD_VERSION }}
    
    steps:
      - name: Download Docker image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}:${{ github.sha }}
      - name: Deploy to production environment
        run: |
          echo "Desplegando en el entorno de producción..."
          # Aquí puedes agregar los comandos específicos para desplegar tu aplicación
          # Por ejemplo, ejecutar un contenedor Docker con la imagen descargada
          docker run -d --name my_app_prod ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}:${{ github.sha }}
