name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  REPO_NAME_AR: ivan-artifact-repo
  REGION: us-central1
  PROJECT_ID: minsaitproject
  IMAGE_NAME: ${{ github.event.repository.name }}
  TAG: v.1.0.0

jobs:
  build-and-push:

    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout code
        uses: actions/checkout@v4
        
        # Configuración de GCP
      - name: Set up Docker credentials for GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up variables
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "BRANCH_NAME=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_ENV"
          else
            echo "BRANCH_NAME=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi  
          
      - name: Set up GCP project
        run: |
          echo "La rama es: $BRANCH_NAME"

          # Evaluacion de la rama con case
          case $BRANCH_NAME in
            main)
              echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
              ;;
            develop|feature/*)
              echo "IMAGE_TAG=$TAG-dev" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Rama no reconocida. Debe ser 'main' o 'develop'."
              exit 1
              ;;
          esac

      # Configura Docker para usar gcloud como helper
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev

      - name: Build Docker image
        run: |
          echo "El tag de la imagen es: $IMAGE_TAG"
          docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME_AR/$IMAGE_NAME:$IMAGE_TAG .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME_AR/$IMAGE_NAME:$IMAGE_TAG

      - name: Confirmar imagen
        run: |
          echo "Desplegando imagen:"
          echo "$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME_AR/$IMAGE_NAME:$IMAGE_TAG"
      
      - name: Set up environment variables
        run: |
          echo "IMAGE_TAG=$IMAGE_TAG" > var.env

      - uses: actions/upload-artifact@v4
        with:
          name: varfile
          path: var.env
          

  deploy-dev:
    
    needs: [build-and-push]
    if: github.ref == 'refs/heads/develop' || 'refs/heads/feature/*'

    runs-on: ubuntu-latest
    environment: 
      name: dev
      url: https://github.com/${{ github.repository }}/releases/tag/v${{ vars.DEV_VERSION }}
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: varfile

      - name: Autenticarse con GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar SDK de GCP
        uses: google-github-actions/setup-gcloud@v2

      - name: Confirmar imagen
        run: |
          source var.env
          echo "$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME_AR/$IMAGE_NAME:$IMAGE_TAG"

      - name: Desplegar a Cloud Run
        run: |
          source var.env
          gcloud run deploy $IMAGE_NAME \
            --image=$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME_AR/$IMAGE_NAME:$IMAGE_TAG \
            --region=$REGION \
            --platform=managed \
            --allow-unauthenticated \
            --project=$PROJECT_ID

  deploy-prod:
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    
    runs-on: ubuntu-latest
    environment: 
      name: prod
      url: https://github.com/${{ github.repository }}/releases/tag/v${{ vars.PROD_VERSION }}
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: varfile

      - name: Autenticarse con GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar SDK de GCP
        uses: google-github-actions/setup-gcloud@v2

      - name: Confirmar imagen
        run: |
          source var.env
          echo "$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME_AR/$IMAGE_NAME:$IMAGE_TAG"

      - name: Desplegar a Cloud Run
        run: |
          source var.env
          gcloud run deploy $IMAGE_NAME \
            --image=$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME_AR/$IMAGE_NAME:$IMAGE_TAG \
            --region=$REGION \
            --platform=managed \
            --allow-unauthenticated \
            --project=$PROJECT_ID
